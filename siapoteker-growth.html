<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a3d2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siapoteker">
<title>@siapoteker — Growth Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ee;
  --bg2: #edeae3;
  --card: #ffffff;
  --ink: #1a1a14;
  --ink2: #5a5a50;
  --ink3: #9a9a8e;
  --green-deep: #0a3d2e;
  --green-mid: #1a6b50;
  --green-light: #d4efe5;
  --green-accent: #2dbe88;
  --amber: #e8a020;
  --amber-bg: #fef3da;
  --red: #c94040;
  --red-bg: #fceaea;
  --blue: #2060c0;
  --blue-bg: #e6eefb;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(10,61,46,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* Header */
.header {
  background: var(--green-deep);
  padding: 52px 20px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: #7ecdb0;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.header-title {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: #ffffff;
  line-height: 1.2;
  margin-bottom: 12px;
}
.header-title span { color: var(--green-accent); font-style: italic; }
.progress-wrap { display: flex; align-items: center; gap: 10px; }
.progress-bar-outer {
  flex: 1;
  height: 5px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: var(--green-accent);
  border-radius: 3px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
}
.progress-text { font-size: 12px; font-weight: 500; color: #7ecdb0; white-space: nowrap; }

/* Filter tabs */
.tabs {
  display: flex;
  gap: 6px;
  padding: 16px 20px 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  border: 1.5px solid var(--bg2);
  background: var(--card);
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.18s;
}
.tab.active { background: var(--green-deep); color: #fff; border-color: var(--green-deep); }

/* Content */
.content { padding: 12px 20px 100px; }

/* Section */
.section { margin-bottom: 8px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 0 10px;
}
.section-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.section-meta { flex: 1; }
.section-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.02em;
}
.section-desc { font-size: 11px; color: var(--ink3); margin-top: 1px; }
.section-badge {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 9px;
  border-radius: 20px;
}

/* Task card */
.task-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.1s, opacity 0.3s;
  position: relative;
  overflow: hidden;
}
.task-card:active { transform: scale(0.98); }
.task-card.done { opacity: 0.55; }
.task-card.done .task-title { text-decoration: line-through; color: var(--ink3); }

.check-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.2s;
  background: transparent;
}
.check-btn.checked { background: var(--green-accent); border-color: var(--green-accent); }
.check-icon { display: none; }
.check-btn.checked .check-icon { display: block; }

.task-body { flex: 1; min-width: 0; }
.task-priority {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.task-title { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.4; }
.task-detail { font-size: 12px; color: var(--ink3); margin-top: 4px; line-height: 1.5; }
.task-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.tag {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 20px;
}

/* Priority colors */
.p-darurat { color: var(--red); }
.p-mingguan { color: var(--amber); }
.p-strategi { color: var(--green-mid); }
.p-monetisasi { color: var(--blue); }

.icon-darurat { background: var(--red-bg); }
.icon-mingguan { background: var(--amber-bg); }
.icon-strategi { background: var(--green-light); }
.icon-monetisasi { background: var(--blue-bg); }

.badge-darurat { background: var(--red-bg); color: var(--red); }
.badge-mingguan { background: var(--amber-bg); color: var(--amber); }
.badge-strategi { background: var(--green-light); color: var(--green-mid); }
.badge-monetisasi { background: var(--blue-bg); color: var(--blue); }

.tag-darurat { background: var(--red-bg); color: var(--red); }
.tag-mingguan { background: var(--amber-bg); color: var(--amber); }
.tag-strategi { background: var(--green-light); color: var(--green-mid); }
.tag-monetisasi { background: var(--blue-bg); color: var(--blue); }

.accent-bar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}
.ab-darurat { background: var(--red); }
.ab-mingguan { background: var(--amber); }
.ab-strategi { background: var(--green-accent); }
.ab-monetisasi { background: var(--blue); }

/* Empty state */
.empty { text-align: center; padding: 48px 20px; color: var(--ink3); font-size: 14px; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }

/* Bottom bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: rgba(245,243,238,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--bg2);
  padding: 12px 20px 24px;
  display: flex;
  gap: 10px;
}
.btn-reset {
  padding: 12px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--bg2);
  background: var(--card);
  color: var(--ink2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
}
.btn-install {
  flex: 1;
  padding: 12px 16px;
  border-radius: 12px;
  border: none;
  background: var(--green-deep);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-install:disabled { opacity: 0.4; }

/* Toast */
.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: 20px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Install banner */
.install-banner {
  background: var(--green-deep);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  display: none;
}
.install-banner.visible { display: flex; }
.install-banner-text { flex: 1; font-size: 13px; line-height: 1.4; }
.install-banner-btn {
  background: var(--green-accent);
  color: var(--green-deep);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  flex-shrink: 0;
}

@media (min-width: 480px) {
  .header { padding: 24px 28px; }
  .tabs { padding: 16px 28px 4px; }
  .content { padding: 12px 28px 100px; }
}
</style>
</head>
<body>

<div id="installBanner" class="install-banner">
  <div class="install-banner-text">Tambahkan ke layar utama untuk akses cepat 📱</div>
  <button class="install-banner-btn" onclick="triggerInstall()">Install</button>
</div>

<div class="header">
  <div class="header-eyebrow">@siapoteker · Growth Plan</div>
  <div class="header-title">Rencana Aksi<br><span>4 Tahun</span> ke Depan</div>
  <div class="progress-wrap">
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">0 / 17 selesai</div>
  </div>
</div>

<div class="tabs" id="tabsWrap">
  <div class="tab active" data-filter="all" onclick="setFilter('all',this)">Semua</div>
  <div class="tab" data-filter="darurat" onclick="setFilter('darurat',this)">🚨 Darurat</div>
  <div class="tab" data-filter="mingguan" onclick="setFilter('mingguan',this)">📅 Mingguan</div>
  <div class="tab" data-filter="strategi" onclick="setFilter('strategi',this)">📈 Strategi</div>
  <div class="tab" data-filter="monetisasi" onclick="setFilter('monetisasi',this)">💰 Monetisasi</div>
</div>

<div class="content" id="content"></div>

<div class="toast" id="toast"></div>

<div class="bottom-bar">
  <button class="btn-reset" onclick="resetAll()">↺ Reset</button>
  <button class="btn-install" id="installBtn" onclick="triggerInstall()" disabled>
    ⬇️ Install di Android
  </button>
</div>

<script>
const TASKS = [
  {
    id: 1, cat: 'darurat', priority: '🚨 Darurat — Lakukan Sekarang',
    title: 'Post konten hari ini juga',
    detail: 'Sudah 14 hari tidak posting. Ambil konten terbaik yang ada, jangan tunggu sempurna. Yang penting tayang dulu — algoritma butuh sinyal aktivitas.',
    tags: ['Hari ini', 'Paling prioritas']
  },
  {
    id: 2, cat: 'darurat', priority: '🚨 Darurat',
    title: 'Balas semua komentar yang belum dibalas',
    detail: 'Buka semua post terakhir dan balas komentar yang masih pending. Ini sinyal ke algoritma bahwa akun aktif dan engaged.',
    tags: ['Hari ini', '< 1 jam']
  },
  {
    id: 3, cat: 'darurat', priority: '🚨 Darurat',
    title: 'Aktifkan notifikasi komentar Instagram',
    detail: 'Pastikan notifikasi komentar & DM aktif di HP. Kecepatan balas dalam 60 menit pertama setelah posting sangat memengaruhi jangkauan.',
    tags: ['Hari ini', 'Setting']
  },
  {
    id: 4, cat: 'mingguan', priority: '📅 Rutinitas Mingguan',
    title: 'Buat jadwal posting 3x/minggu',
    detail: 'Pilih 3 hari tetap, misalnya Senin, Rabu, Jumat pukul 11.00–13.00. Konsistensi jam posting membantu algoritma mendistribusikan konten.',
    tags: ['Konsistensi', 'Jadwal tetap']
  },
  {
    id: 5, cat: 'mingguan', priority: '📅 Rutinitas Mingguan',
    title: 'Balas komentar dalam 60 menit pertama',
    detail: 'Setiap kali posting, pantau notifikasi dan balas semua komentar masuk dalam 1 jam. Ini boost organik terbesar yang bisa dilakukan gratis.',
    tags: ['Setiap posting', 'Engagement']
  },
  {
    id: 6, cat: 'mingguan', priority: '📅 Rutinitas Mingguan',
    title: 'Cek Instagram Insights setiap Senin',
    detail: 'Lihat post mana minggu lalu yang perform terbaik. Catat topik & hook-nya, lalu duplikasi pola itu di minggu berikutnya.',
    tags: ['Analitik', 'Mingguan']
  },
  {
    id: 7, cat: 'mingguan', priority: '📅 Rutinitas Mingguan',
    title: 'Upload 1 IG Story setiap hari posting',
    detail: 'Story membantu mengingatkan followers bahwa ada konten baru. Gunakan fitur polling atau pertanyaan untuk boost interaksi.',
    tags: ['Stories', 'Harian']
  },
  {
    id: 8, cat: 'strategi', priority: '📈 Strategi Konten',
    title: 'Tentukan 4 content pillar tetap',
    detail: 'Contoh: (1) Bahaya interaksi obat, (2) Cara kerja obat, (3) Mitos vs fakta kesehatan, (4) Tips penggunaan obat. Rotasi keempat tema ini setiap minggu.',
    tags: ['Konten', 'Struktur']
  },
  {
    id: 9, cat: 'strategi', priority: '📈 Strategi Konten',
    title: 'Perbanyak format "konflik & peringatan"',
    detail: 'Data akun kamu membuktikan: "Tanin vs Zat Besi" (2.271 likes) dan "Jangan Campur Obat Tensi+Nyeri" (2.065 likes). Format ini terbukti viral — duplikasi terus.',
    tags: ['Viral format', 'Terbukti']
  },
  {
    id: 10, cat: 'strategi', priority: '📈 Strategi Konten',
    title: 'Buat template animasi siap pakai',
    detail: 'Desain 3–5 template animasi yang bisa diisi konten berbeda dalam waktu singkat. Ini memotong waktu produksi 50–70% dan memungkinkan konsistensi posting.',
    tags: ['Produksi', 'Efisiensi']
  },
  {
    id: 11, cat: 'strategi', priority: '📈 Strategi Konten',
    title: 'Tambahkan format Carousel (swipe post)',
    detail: 'Carousel rata-rata mendapat 3x lebih banyak reach dibanding single image. Cocok untuk topik "7 obat yang tidak boleh dicampur" atau "5 fakta obat generik".',
    tags: ['Format baru', 'Reach']
  },
  {
    id: 12, cat: 'strategi', priority: '📈 Strategi Konten',
    title: 'Ekspansi ke TikTok & YouTube Shorts',
    detail: 'Repost konten Reels terbaik ke TikTok dan YouTube Shorts. Satu konten = 3 platform, tanpa kerja ekstra. Diversifikasi dari ketergantungan satu algoritma.',
    tags: ['Multi-platform', 'Ekspansi']
  },
  {
    id: 13, cat: 'strategi', priority: '📈 Strategi Konten',
    title: 'Gelar Instagram Live Q&A bulanan',
    detail: 'Satu Live per bulan dengan tema "Tanya Apoteker". Ini membangun kepercayaan, boost reach organik, dan menciptakan koneksi nyata dengan audiens.',
    tags: ['Live', 'Bulanan']
  },
  {
    id: 14, cat: 'strategi', priority: '📈 Strategi Konten',
    title: 'Riset & update hashtag farmasi Indonesia',
    detail: 'Cari 10–15 hashtag spesifik: campuran besar (#kesehatanIndonesia), menengah (#apoteker), dan niche (#edukasifarmasi). Update setiap 2 bulan.',
    tags: ['SEO Instagram', 'Hashtag']
  },
  {
    id: 15, cat: 'monetisasi', priority: '💰 Monetisasi (Tahun 1–2)',
    title: 'Daftar dan lengkapi Meta Business Suite',
    detail: 'Aktifkan Creator Studio dan hubungkan akun ke Meta Business Suite. Ini membuka akses ke brand partnership, in-stream ads, dan data analitik lanjutan.',
    tags: ['Setup', 'Tahun 1']
  },
  {
    id: 16, cat: 'monetisasi', priority: '💰 Monetisasi (Tahun 1–2)',
    title: 'Pitch brand deal pertama ke brand farmasi',
    detail: 'Buat media kit sederhana (1 halaman): statistik akun, niche, dan rate card. Hubungi brand suplemen, apotek jaringan, atau aplikasi kesehatan (Halodoc, Alodokter).',
    tags: ['Revenue', 'Tahun 1']
  },
  {
    id: 17, cat: 'monetisasi', priority: '💰 Monetisasi (Tahun 2)',
    title: 'Buat e-book atau kelas online pertama',
    detail: 'Contoh: "Panduan Lengkap Penggunaan Obat Rumahan" atau kelas animasi kesehatan untuk tenaga medis. Monetisasi mandiri tanpa bergantung pada brand.',
    tags: ['Produk digital', 'Tahun 2']
  }
];

const CATS = {
  darurat: { name: '🚨 Darurat', desc: 'Lakukan dalam 24 jam ke depan', badge: 'badge-darurat', icon: 'icon-darurat', bar: 'ab-darurat', pColor: 'p-darurat' },
  mingguan: { name: '📅 Rutinitas', desc: 'Kebiasaan mingguan yang wajib dijaga', badge: 'badge-mingguan', icon: 'icon-mingguan', bar: 'ab-mingguan', pColor: 'p-mingguan' },
  strategi: { name: '📈 Strategi Konten', desc: 'Taktik pertumbuhan jangka menengah', badge: 'badge-strategi', icon: 'icon-strategi', bar: 'ab-strategi', pColor: 'p-strategi' },
  monetisasi: { name: '💰 Monetisasi', desc: 'Rencana penghasilan tahun 1–2', badge: 'badge-monetisasi', icon: 'icon-monetisasi', bar: 'ab-monetisasi', pColor: 'p-monetisasi' }
};

let done = JSON.parse(localStorage.getItem('siapoteker_done') || '[]');
let currentFilter = 'all';

function save() { localStorage.setItem('siapoteker_done', JSON.stringify(done)); }

function toggle(id) {
  if (done.includes(id)) {
    done = done.filter(d => d !== id);
    showToast('Tandai belum selesai');
  } else {
    done.push(id);
    showToast('✓ Selesai! Bagus sekali 💪');
  }
  save();
  render();
}

function resetAll() {
  if (!confirm('Reset semua progres?')) return;
  done = [];
  save();
  render();
  showToast('Progres direset');
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const total = TASKS.length;
  const doneCount = TASKS.filter(t => done.includes(t.id)).length;
  const pct = Math.round(doneCount / total * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${doneCount} / ${total} selesai`;

  const filtered = currentFilter === 'all' ? TASKS : TASKS.filter(t => t.cat === currentFilter);
  const cats = [...new Set(filtered.map(t => t.cat))];

  let html = '';
  cats.forEach(cat => {
    const catTasks = filtered.filter(t => t.cat === cat);
    const catDone = catTasks.filter(t => done.includes(t.id)).length;
    const c = CATS[cat];
    html += `<div class="section">
      <div class="section-header">
        <div class="section-icon ${c.icon}">${getCatEmoji(cat)}</div>
        <div class="section-meta">
          <div class="section-name">${c.name}</div>
          <div class="section-desc">${c.desc}</div>
        </div>
        <span class="section-badge ${c.badge}">${catDone}/${catTasks.length}</span>
      </div>`;
    catTasks.forEach(t => {
      const isDone = done.includes(t.id);
      html += `<div class="task-card ${isDone ? 'done' : ''}" onclick="toggle(${t.id})">
        <div class="accent-bar ${c.bar}"></div>
        <div class="check-btn ${isDone ? 'checked' : ''}">
          <svg class="check-icon" width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 6l3 3 5-5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-body">
          <div class="task-priority ${c.pColor}">${t.priority}</div>
          <div class="task-title">${t.title}</div>
          <div class="task-detail">${t.detail}</div>
          <div class="task-tags">${t.tags.map(g => `<span class="tag tag-${cat}">${g}</span>`).join('')}</div>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  if (!html) html = '<div class="empty"><div class="empty-icon">🎉</div>Semua tugas di kategori ini sudah selesai!</div>';
  document.getElementById('content').innerHTML = html;
}

function getCatEmoji(cat) {
  return { darurat: '🚨', mingguan: '📅', strategi: '📈', monetisasi: '💰' }[cat];
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// PWA install
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').disabled = false;
  document.getElementById('installBanner').classList.add('visible');
});

function triggerInstall() {
  if (!deferredPrompt) {
    showToast('Buka di Chrome Android untuk install');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(r => {
    if (r.outcome === 'accepted') {
      showToast('✓ Berhasil diinstall!');
      document.getElementById('installBanner').classList.remove('visible');
    }
    deferredPrompt = null;
  });
}

window.addEventListener('appinstalled', () => {
  showToast('App berhasil dipasang 🎉');
  document.getElementById('installBanner').classList.remove('visible');
});

render();
</script>

<script>
// Service Worker registration for PWA
if ('serviceWorker' in navigator) {
  const swCode = `
